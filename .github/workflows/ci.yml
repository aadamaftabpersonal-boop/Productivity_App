name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cphub_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cphub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://cphub_test:test@localhost:5432/cphub_test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-prod
      GROQ_API_KEY: ci-test-key-not-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-asyncio httpx uvicorn aiosqlite
          # pinned: newer bcrypt breaks passlib's version-detection probe
          pip install "bcrypt==4.0.1"

      - name: Run test suite
        run: pytest tests/ -v
